{% extends "base.html" %}

{% block titulo %}Productos{% endblock %}

{% block contenido %}
    <h1>Productos</h1>
    <a href="{{ url_for('nuevos_productos') }}" class="btn btn-success mb-3">Nuevo producto</a>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Categoría</th>
            </tr>
        </thead>
        <tbody>
            {% for p in productos %}
            <tr>
                <td>{{ p.nombre }}</td>
                <td>${{ p.precio }}</td>
                <td>{{ p.stock }}</td>
                <td>{{ p.categoria.nombre }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
